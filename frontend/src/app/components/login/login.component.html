<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Log in to play Guess The Word or access reports</p>
    </div>

    <div class="alert alert-error" *ngIf="errorMessage">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Authenticating...</span>
      </button>
    </form>

    <div class="demo-quick-fill">
      <p class="demo-title">Quick Demo Login:</p>
      <div class="demo-buttons">
        <button type="button" class="btn btn-secondary btn-sm" (click)="fillDemo('PLAYER')">🎮 Player Demo</button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="fillDemo('ADMIN')">📊 Admin Demo</button>
      </div>
    </div>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </div>
  </div>
</div>
